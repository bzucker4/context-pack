name: Release Obsidian plugin

on:
    push:
        tags:
            # Plain versions only (e.g. 0.1.0). Obsidian requires no "v" prefix.
            - '[0-9]+.[0-9]+.[0-9]+'
    # Manual run: rebuild and attach assets for an existing tag.
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing tag to build and release, e.g. 0.1.0 (no "v" prefix)'
                required: true
                type: string

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
                  assets="main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}"

                  if ! echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "Tag '$tag' is not a plain version like 0.1.0" >&2
                    exit 1
                  fi

                  if gh release view "$tag" >/dev/null 2>&1; then
                    # Release already exists (e.g. created by hand): attach or replace assets.
                    gh release upload "$tag" $assets --clobber
                  else
                    gh release create "$tag" \
                      --title="$tag" \
                      --draft \
                      $assets
                  fi
